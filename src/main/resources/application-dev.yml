spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resume_builder_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long-for-testing}
    access-token-expiration: 3600000  # 1 hour for dev
    refresh-token-expiration: 86400000  # 24 hours for dev

logging:
  level:
    com.resumebuilder: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
